; Connection pool configuration for the platform services.
; Revision is bumped on every change so the fleet can tell stale copies apart.
; Owner: platform-db. Page @db-oncall before changing pool.audit.

[global]
revision = 7
; Seconds a checked-out connection may be idle before it is recycled.
idle_timeout = 300
# The primary listens on the non-default port since the 2025 migration.
port = 5420

[pool.web]
; Sized for the 8 web nodes; max_connections = 20 was chosen when we had 4.
max_connections = 20
min_idle = 2
; Web traffic is bursty, so warm the pool at boot.
warm = true

[pool.api]
max_connections = 20
min_idle = 4
warm = true
; The API pool shares the primary with pool.web; keep the two in step.

[pool.jobs]
; Background jobs hold connections for long transactions.
max_connections = 20
min_idle = 1
statement_timeout = 600
warm = false

[pool.audit]
; Audit writes go to the compliance replica. Fixed at 10 by the DBA;
; do not raise without a change ticket.
max_connections = 10
min_idle = 1
warm = false

[pool.reports]
max_connections = 20
; Reports run overnight, so nothing is kept idle during the day.
min_idle = 0
warm = false

[logging]
; slow_query_ms is deliberately low; the DBA reviews the log weekly.
slow_query_ms = 200
level = info
