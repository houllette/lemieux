[tls]
min_version = 1.2
# The reader tolerates trailing whitespace. See the runbook for the rollout procedure.
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# Operators should not edit generated files by hand. A value set here applies only after the next reload.
cipher_profile = intermediate
# The reader tolerates trailing whitespace. The service keeps its state in an append-only journal and rebuilds the index on start.
# See the runbook for the rollout procedure. Retries are bounded and jittered. Retries are bounded and jittered. Keys are compared case-sensitively.

[queue]
batch_size = 20
dead_letter = on
# Retries are bounded and jittered. The reader tolerates trailing whitespace.
include = includes/batch-tuning.conf
# Every entry is validated before it is written. Retries are bounded and jittered. A value set here applies only after the next reload. A value set here applies only after the next reload.

[http]
keepalive_s = 1800
max_body_bytes = 1048576
workers = 4096
# See the runbook for the rollout procedure. This section is kept for historical reasons and may be removed in a later revision.
compression = off
include = includes/compat-2025.conf
# The service keeps its state in an append-only journal and rebuilds the index on start. The default is deliberately conservative. Retries are bounded and jittered. See the runbook for the rollout procedure.

[cache]
shard_count = 10
# Unknown keys are ignored with a warning. The reader tolerates trailing whitespace.
backend = tiered
# Keys are compared case-sensitively. Unknown keys are ignored with a warning.
# A value set here applies only after the next reload. See the runbook for the rollout procedure. See the runbook for the rollout procedure. The reader tolerates trailing whitespace.

[logging]
level = debug
