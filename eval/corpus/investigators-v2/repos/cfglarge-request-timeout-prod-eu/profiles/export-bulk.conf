inherits = export
# export-bulk: Retries are bounded and jittered. The default is deliberately conservative.
# See the runbook for the rollout procedure. The service keeps its state in an append-only journal and rebuilds the index on start. The default is deliberately conservative. Every entry is validated before it is written.

[tls]
cipher_profile = modern
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand. Retries are bounded and jittered. Every entry is validated before it is written.

[cache]
shard_count = 2048
backend = disk
# See the runbook for the rollout procedure. Unknown keys are ignored with a warning.
include = includes/feature-defaults.conf
# The default is deliberately conservative. The default is deliberately conservative. A value set here applies only after the next reload. Operators should not edit generated files by hand.

[features]
invoice_layout = letter
search_engine = vector
# Operators should not edit generated files by hand. Keys are compared case-sensitively.
# Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start. Retries are bounded and jittered. Keys are compared case-sensitively.

[logging]
level = warn
sample_rate = 1.0
# Every entry is validated before it is written. The reader tolerates trailing whitespace.
format = json
# Retries are bounded and jittered. See the runbook for the rollout procedure. A value set here applies only after the next reload. Every entry is validated before it is written.

[limits]
burst = 1024
concurrent_exports = 1024
# See the runbook for the rollout procedure. Keys are compared case-sensitively.
# See the runbook for the rollout procedure. This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. A value set here applies only after the next reload.

[queue]
visibility_s = 900
dead_letter = on
# This section is kept for historical reasons and may be removed in a later revision. This section is kept for historical reasons and may be removed in a later revision.
batch_size = 2
