# archived; not read by any target

[http]
max_body_bytes = 16777216
keepalive_s = 120
compression = off

[db]
pool_size = 40
replica = off
retry_limit = 32

[cache]
max_entries = 64

[features]
checkout_variant = classic
search_engine = hybrid

[logging]
sink = @sinks/secondary
sample_rate = 1.0
format = text

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
cipher_profile = modern

[queue]
prefetch = 64
visibility_s = 120
dead_letter = on

[limits]
burst = 24
