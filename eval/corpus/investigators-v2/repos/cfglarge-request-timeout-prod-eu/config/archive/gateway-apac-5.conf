# archived; not read by any target

[db]
statement_timeout_ms = 4500
retry_limit = 64

[cache]
backend = tiered

[features]
invoice_layout = compact
beta_banner = off

[logging]
sink = @sinks/eu-collector
level = debug
format = json

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.2
cipher_profile = compat

[queue]
prefetch = 32
visibility_s = 600

[limits]
concurrent_exports = 48
