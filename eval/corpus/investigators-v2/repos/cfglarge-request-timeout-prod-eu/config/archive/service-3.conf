# archived; not read by any target

[http]
keepalive_s = 1800
workers = 128

[db]
pool_size = 2
retry_limit = 4
ssl_mode = verify-full

[cache]
backend = redis-like
shard_count = 3

[logging]
sink = @sinks/primary
format = text

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem

[queue]
visibility_s = 30
dead_letter = on

[limits]
concurrent_exports = 3
