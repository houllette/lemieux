# archived; not read by any target

[http]
request_timeout_ms = 4500
max_body_bytes = 2097152
keepalive_s = 900
workers = 96
compression = off

[db]
pool_size = 8
retry_limit = 16
ssl_mode = require

[cache]
ttl_seconds = 60
max_entries = 3
backend = disk
shard_count = 512

[features]
invoice_layout = compact

[logging]
sink = @sinks/us-collector
level = error

[queue]
visibility_s = 45

[limits]
burst = 12
upload_mb = 40
