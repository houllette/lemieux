# archived; not read by any target

[http]
compression = on

[db]
pool_size = 64
statement_timeout_ms = 9000
retry_limit = 4096

[cache]
backend = memory

[features]
search_engine = legacy
invoice_layout = letter

[logging]
sample_rate = 0.05

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.2

[queue]
dead_letter = on

[limits]
upload_mb = 2048
