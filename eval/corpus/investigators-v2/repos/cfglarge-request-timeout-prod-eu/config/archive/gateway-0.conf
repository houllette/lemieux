# archived; not read by any target

[http]
request_timeout_ms = 750
keepalive_s = 45

[db]
pool_size = 2048
retry_limit = 40
ssl_mode = prefer

[cache]
max_entries = 8
shard_count = 48

[features]
checkout_variant = guided
beta_banner = on

[logging]
sink = @sinks/apac-collector
format = json

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem

[queue]
prefetch = 10
visibility_s = 15
dead_letter = on
batch_size = 64
