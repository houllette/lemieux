# overlay: low-memory
# low-memory: Keys are compared case-sensitively. Retries are bounded and jittered.
# Unknown keys are ignored with a warning. See the runbook for the rollout procedure. The service keeps its state in an append-only journal and rebuilds the index on start. Keys are compared case-sensitively.

[db]
ssl_mode = prefer
retry_limit = 256
# Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision.
pool_size = 24
# Retries are bounded and jittered. This section is kept for historical reasons and may be removed in a later revision.
statement_timeout_ms = 2000
# This section is kept for historical reasons and may be removed in a later revision. This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. Retries are bounded and jittered.

[queue]
dead_letter = on
# A value set here applies only after the next reload. See the runbook for the rollout procedure.
visibility_s = 90
# Unknown keys are ignored with a warning. Every entry is validated before it is written.
batch_size = 12
prefetch = 64
# Unknown keys are ignored with a warning. The default is deliberately conservative. Retries are bounded and jittered. The reader tolerates trailing whitespace.

[logging]
sink = @sinks/debug
sample_rate = 0.01
format = logfmt
# The default is deliberately conservative. The service keeps its state in an append-only journal and rebuilds the index on start.
level = error
# Operators should not edit generated files by hand. Unknown keys are ignored with a warning. Every entry is validated before it is written. The reader tolerates trailing whitespace.

[features]
checkout_variant = classic
invoice_layout = a4
# Keys are compared case-sensitively. Every entry is validated before it is written.
beta_banner = on
# Retries are bounded and jittered. Keys are compared case-sensitively.
search_engine = legacy
# The service keeps its state in an append-only journal and rebuilds the index on start. See the runbook for the rollout procedure. This section is kept for historical reasons and may be removed in a later revision. Unknown keys are ignored with a warning.

[cache]
shard_count = 32
max_entries = 4096
# history: Keys are compared case-sensitively. A value set here applies only after the next reload. Retries are bounded and jittered. Operators should not edit generated files by hand. See the runbook for the rollout procedure.
