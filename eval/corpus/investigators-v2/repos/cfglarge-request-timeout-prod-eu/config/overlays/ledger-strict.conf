# overlay: ledger-strict
# ledger-strict: Keys are compared case-sensitively. Retries are bounded and jittered.
# The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand. The reader tolerates trailing whitespace. This section is kept for historical reasons and may be removed in a later revision.

[limits]
concurrent_exports = 256
burst = 2048
# This section is kept for historical reasons and may be removed in a later revision. The reader tolerates trailing whitespace. The default is deliberately conservative. Retries are bounded and jittered.

[http]
max_body_bytes = 8388608
request_timeout_ms = 250
workers = 10
compression = on
# This section is kept for historical reasons and may be removed in a later revision. The service keeps its state in an append-only journal and rebuilds the index on start.
keepalive_s = 900
# The reader tolerates trailing whitespace. Operators should not edit generated files by hand.
# Unknown keys are ignored with a warning. The default is deliberately conservative. Retries are bounded and jittered. The service keeps its state in an append-only journal and rebuilds the index on start.

[logging]
sink = @sinks/primary
# This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative.
level = warn
sample_rate = 0.1
# The default is deliberately conservative. Unknown keys are ignored with a warning. Retries are bounded and jittered. Keys are compared case-sensitively.

[cache]
backend = tiered
# The reader tolerates trailing whitespace. Operators should not edit generated files by hand.
ttl_seconds = 90
# Retries are bounded and jittered. Keys are compared case-sensitively.
# Every entry is validated before it is written. Keys are compared case-sensitively. Every entry is validated before it is written. A value set here applies only after the next reload.

[tls]
cipher_profile = modern
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# Keys are compared case-sensitively. Unknown keys are ignored with a warning.
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# Keys are compared case-sensitively. The reader tolerates trailing whitespace.
min_version = 1.3
# A value set here applies only after the next reload. The default is deliberately conservative. Operators should not edit generated files by hand. Retries are bounded and jittered.

[features]
checkout_variant = compact
search_engine = legacy
# Keys are compared case-sensitively. Retries are bounded and jittered.
# history: This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered. Keys are compared case-sensitively. Retries are bounded and jittered. Unknown keys are ignored with a warning.
