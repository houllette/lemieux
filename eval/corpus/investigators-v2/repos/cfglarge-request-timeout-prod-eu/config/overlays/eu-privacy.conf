# overlay: eu-privacy
# eu-privacy: Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start.
# The default is deliberately conservative. See the runbook for the rollout procedure. Unknown keys are ignored with a warning. Every entry is validated before it is written.

[queue]
batch_size = 128
# This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative.
prefetch = 48
dead_letter = off
# Operators should not edit generated files by hand. The service keeps its state in an append-only journal and rebuilds the index on start.
visibility_s = 900
# The reader tolerates trailing whitespace. The reader tolerates trailing whitespace.
# The default is deliberately conservative. The reader tolerates trailing whitespace. The reader tolerates trailing whitespace. Retries are bounded and jittered.

[logging]
sample_rate = 0.5
format = json
# A value set here applies only after the next reload. A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand.

[cache]
shard_count = 24
# See the runbook for the rollout procedure. See the runbook for the rollout procedure.
backend = disk
max_entries = 1024
# The reader tolerates trailing whitespace. Keys are compared case-sensitively. See the runbook for the rollout procedure. A value set here applies only after the next reload.

[tls]
min_version = 1.3
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
cipher_profile = modern
# Operators should not edit generated files by hand. Unknown keys are ignored with a warning.
# This section is kept for historical reasons and may be removed in a later revision. Unknown keys are ignored with a warning. Unknown keys are ignored with a warning. Unknown keys are ignored with a warning.

[features]
checkout_variant = classic
search_engine = vector
invoice_layout = compact
# The default is deliberately conservative. See the runbook for the rollout procedure. Retries are bounded and jittered. This section is kept for historical reasons and may be removed in a later revision.

[http]
max_body_bytes = 1048576
# This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative.
workers = 20
# See the runbook for the rollout procedure. Keys are compared case-sensitively.
compression = on
