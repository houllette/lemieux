# overlay: legacy-clients
# legacy-clients: See the runbook for the rollout procedure. Keys are compared case-sensitively.
# The default is deliberately conservative. A value set here applies only after the next reload. Unknown keys are ignored with a warning. Unknown keys are ignored with a warning.

[http]
compression = on
max_body_bytes = 2097152
keepalive_s = 120
workers = 512
# This section is kept for historical reasons and may be removed in a later revision. Operators should not edit generated files by hand. Keys are compared case-sensitively. The default is deliberately conservative.

[cache]
shard_count = 512
max_entries = 64
# A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start.
ttl_seconds = 15
# This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative.
backend = tiered
# Every entry is validated before it is written. See the runbook for the rollout procedure. Retries are bounded and jittered. Operators should not edit generated files by hand.

[logging]
sample_rate = 0.05
# The default is deliberately conservative. Unknown keys are ignored with a warning.
sink = @sinks/us-collector
# Operators should not edit generated files by hand. Retries are bounded and jittered. Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision.

[features]
checkout_variant = split
# Operators should not edit generated files by hand. Unknown keys are ignored with a warning.
search_engine = vector
# See the runbook for the rollout procedure. Every entry is validated before it is written. This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative.

[limits]
burst = 12
concurrent_exports = 3
# Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start.
rps = 48
# The reader tolerates trailing whitespace. The default is deliberately conservative.
upload_mb = 2
# The reader tolerates trailing whitespace. This section is kept for historical reasons and may be removed in a later revision. Unknown keys are ignored with a warning. The default is deliberately conservative.

[db]
statement_timeout_ms = 9000
replica = on
# Retries are bounded and jittered. The service keeps its state in an append-only journal and rebuilds the index on start.
retry_limit = 40
