# overlay: ledger-strict
# ledger-strict: See the runbook for the rollout procedure. The default is deliberately conservative.
# Unknown keys are ignored with a warning. Retries are bounded and jittered. Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start.

[http]
max_body_bytes = 1048576
keepalive_s = 90
# See the runbook for the rollout procedure. A value set here applies only after the next reload.
# The reader tolerates trailing whitespace. Unknown keys are ignored with a warning. See the runbook for the rollout procedure. The reader tolerates trailing whitespace.

[cache]
ttl_seconds = 600
max_entries = 32
# The service keeps its state in an append-only journal and rebuilds the index on start. A value set here applies only after the next reload. Unknown keys are ignored with a warning. Keys are compared case-sensitively.

[limits]
upload_mb = 3
# Keys are compared case-sensitively. Operators should not edit generated files by hand.
concurrent_exports = 4
# The reader tolerates trailing whitespace. Operators should not edit generated files by hand. Keys are compared case-sensitively. Retries are bounded and jittered.

[queue]
batch_size = 64
# A value set here applies only after the next reload. Every entry is validated before it is written.
prefetch = 6
# Retries are bounded and jittered. The default is deliberately conservative.
# Every entry is validated before it is written. Keys are compared case-sensitively. The default is deliberately conservative. See the runbook for the rollout procedure.

[db]
retry_limit = 10
# This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered.
statement_timeout_ms = 500
# Unknown keys are ignored with a warning. This section is kept for historical reasons and may be removed in a later revision.
replica = on
# This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative. Every entry is validated before it is written. A value set here applies only after the next reload.

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.3
cipher_profile = modern
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# See the runbook for the rollout procedure. See the runbook for the rollout procedure.
# A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start. A value set here applies only after the next reload. The reader tolerates trailing whitespace.

[logging]
sink = @sinks/debug
level = debug
# history: Operators should not edit generated files by hand. Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start. Unknown keys are ignored with a warning. Unknown keys are ignored with a warning.

[db]
pool_size = 12
