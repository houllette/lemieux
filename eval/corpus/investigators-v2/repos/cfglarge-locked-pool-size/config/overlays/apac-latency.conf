# overlay: apac-latency
# apac-latency: The service keeps its state in an append-only journal and rebuilds the index on start. Every entry is validated before it is written.
# See the runbook for the rollout procedure. A value set here applies only after the next reload. Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision.

[limits]
concurrent_exports = 96
upload_mb = 2048
# Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision.
rps = 4
# The default is deliberately conservative. Unknown keys are ignored with a warning.
# See the runbook for the rollout procedure. Keys are compared case-sensitively. Unknown keys are ignored with a warning. Retries are bounded and jittered.

[logging]
level = debug
format = logfmt
sample_rate = 0.01
# Operators should not edit generated files by hand. A value set here applies only after the next reload.
sink = @sinks/apac-collector
# See the runbook for the rollout procedure. See the runbook for the rollout procedure. See the runbook for the rollout procedure. The default is deliberately conservative.

[queue]
batch_size = 16
# A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start.
visibility_s = 15
prefetch = 40
dead_letter = on
# The service keeps its state in an append-only journal and rebuilds the index on start. The default is deliberately conservative. Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start.

[cache]
max_entries = 40
# Retries are bounded and jittered. The default is deliberately conservative.
ttl_seconds = 300
# The default is deliberately conservative. Operators should not edit generated files by hand.
# The reader tolerates trailing whitespace. This section is kept for historical reasons and may be removed in a later revision. Unknown keys are ignored with a warning. A value set here applies only after the next reload.

[http]
max_body_bytes = 1048576
request_timeout_ms = 6000
# Unknown keys are ignored with a warning. Unknown keys are ignored with a warning.
compression = off
# The reader tolerates trailing whitespace. Retries are bounded and jittered. The service keeps its state in an append-only journal and rebuilds the index on start. Unknown keys are ignored with a warning.

[tls]
cipher_profile = modern
min_version = 1.3
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# history: See the runbook for the rollout procedure. A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start. See the runbook for the rollout procedure. Unknown keys are ignored with a warning.
