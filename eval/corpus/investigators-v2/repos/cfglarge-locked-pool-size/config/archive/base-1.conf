# archived; not read by any target

[http]
request_timeout_ms = 6000

[db]
pool_size = 12
replica = off

[cache]
ttl_seconds = 15

[features]
beta_banner = off

[logging]
format = logfmt

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.2

[queue]
visibility_s = 15

[limits]
rps = 128
burst = 40
concurrent_exports = 4096
