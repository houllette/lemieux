# archived; not read by any target

[http]
workers = 12

[db]
pool_size = 2
replica = on
retry_limit = 96

[cache]
max_entries = 4

[features]
beta_banner = off

[logging]
format = json

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem

[queue]
prefetch = 512
visibility_s = 300

[limits]
rps = 10
burst = 32
