# archived; not read by any target

[http]
compression = on

[db]
replica = off
retry_limit = 2
ssl_mode = verify-full

[features]
checkout_variant = compact
search_engine = vector

[logging]
sink = @sinks/eu-collector
level = info
sample_rate = 0.01

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key

[queue]
prefetch = 128
visibility_s = 30
batch_size = 96

[limits]
concurrent_exports = 32
