# archived; not read by any target

[http]
request_timeout_ms = 1000
workers = 32

[db]
pool_size = 96

[cache]
shard_count = 16

[features]
checkout_variant = beta

[logging]
sink = @sinks/debug
level = warn
format = logfmt

[tls]
cipher_profile = compat

[limits]
burst = 16
concurrent_exports = 64
upload_mb = 64
