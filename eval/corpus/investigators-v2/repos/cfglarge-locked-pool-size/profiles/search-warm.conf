inherits = search
# search-warm: The default is deliberately conservative. The reader tolerates trailing whitespace.
# This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. Unknown keys are ignored with a warning. The default is deliberately conservative.

[db]
statement_timeout_ms = 1000
# See the runbook for the rollout procedure. The reader tolerates trailing whitespace.
retry_limit = 4
# Operators should not edit generated files by hand. This section is kept for historical reasons and may be removed in a later revision.
replica = off
include = includes/limits-defaults.conf
# This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. Retries are bounded and jittered. The default is deliberately conservative.

[limits]
rps = 48
upload_mb = 4096
concurrent_exports = 12
burst = 4
# This section is kept for historical reasons and may be removed in a later revision. A value set here applies only after the next reload. See the runbook for the rollout procedure. The default is deliberately conservative.

[queue]
dead_letter = off
# A value set here applies only after the next reload. See the runbook for the rollout procedure.
prefetch = 12
# Unknown keys are ignored with a warning. Unknown keys are ignored with a warning.
include = includes/hot-path.conf
# Unknown keys are ignored with a warning. Operators should not edit generated files by hand. Retries are bounded and jittered. This section is kept for historical reasons and may be removed in a later revision.

[cache]
max_entries = 48
# Retries are bounded and jittered. The reader tolerates trailing whitespace.
shard_count = 4096
include = includes/eu-tuning.conf
# This section is kept for historical reasons and may be removed in a later revision. The reader tolerates trailing whitespace. The default is deliberately conservative. Keys are compared case-sensitively.

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# The default is deliberately conservative. Every entry is validated before it is written.
cipher_profile = intermediate
# A value set here applies only after the next reload. See the runbook for the rollout procedure.
min_version = 1.3
# Unknown keys are ignored with a warning. Operators should not edit generated files by hand.
