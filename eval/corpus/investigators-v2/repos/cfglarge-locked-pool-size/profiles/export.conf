inherits = worker-batch
# export: The service keeps its state in an append-only journal and rebuilds the index on start. The reader tolerates trailing whitespace.
include = includes/feature-defaults.conf
# The service keeps its state in an append-only journal and rebuilds the index on start. Every entry is validated before it is written. Every entry is validated before it is written. See the runbook for the rollout procedure.

[cache]
