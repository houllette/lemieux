# overlay: eu-privacy
# eu-privacy: The default is deliberately conservative. Retries are bounded and jittered.
# A value set here applies only after the next reload. Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision. Operators should not edit generated files by hand.

[db]
retry_limit = 20
# Keys are compared case-sensitively. Every entry is validated before it is written.
pool_size = 48
replica = on
# The default is deliberately conservative. Keys are compared case-sensitively.
ssl_mode = prefer
# This section is kept for historical reasons and may be removed in a later revision. A value set here applies only after the next reload. Every entry is validated before it is written. The default is deliberately conservative.

[queue]
dead_letter = on
prefetch = 3
# Keys are compared case-sensitively. Retries are bounded and jittered. Operators should not edit generated files by hand. The default is deliberately conservative.

[logging]
sample_rate = 0.5
sink = @sinks/debug
# Keys are compared case-sensitively. The default is deliberately conservative.
level = warn
# See the runbook for the rollout procedure. The reader tolerates trailing whitespace. Every entry is validated before it is written. Retries are bounded and jittered.

[cache]
backend = redis-like
ttl_seconds = 30
shard_count = 20
max_entries = 96
# Unknown keys are ignored with a warning. Keys are compared case-sensitively.
# The service keeps its state in an append-only journal and rebuilds the index on start. Retries are bounded and jittered. Unknown keys are ignored with a warning. Retries are bounded and jittered.

[tls]
cipher_profile = intermediate
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.3
# Operators should not edit generated files by hand. Retries are bounded and jittered.
# Operators should not edit generated files by hand. Retries are bounded and jittered. A value set here applies only after the next reload. Keys are compared case-sensitively.

[http]
compression = on
workers = 10
request_timeout_ms = 3000
# Operators should not edit generated files by hand. Operators should not edit generated files by hand. Operators should not edit generated files by hand. A value set here applies only after the next reload.

[features]
search_engine = lexical
# Retries are bounded and jittered. Keys are compared case-sensitively.
beta_banner = off
# A value set here applies only after the next reload. Retries are bounded and jittered. See the runbook for the rollout procedure. The default is deliberately conservative.

[limits]
rps = 12
upload_mb = 4
concurrent_exports = 40
