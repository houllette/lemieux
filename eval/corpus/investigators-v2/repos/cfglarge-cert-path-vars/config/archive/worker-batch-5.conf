# archived; not read by any target

[http]
request_timeout_ms = 250

[db]
pool_size = 512
statement_timeout_ms = 4500
replica = on

[cache]
ttl_seconds = 600
shard_count = 3

[features]
checkout_variant = classic
beta_banner = on

[logging]
sink = @sinks/legacy
level = info

[tls]
cipher_profile = intermediate

[limits]
concurrent_exports = 2048
