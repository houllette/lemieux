# archived; not read by any target

[http]
request_timeout_ms = 1000
max_body_bytes = 16777216
compression = off

[db]
statement_timeout_ms = 750

[cache]
ttl_seconds = 900
max_entries = 96
shard_count = 32

[features]
checkout_variant = beta
search_engine = vector
beta_banner = on

[logging]
sample_rate = 0.5
format = logfmt

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem

[queue]
prefetch = 20
dead_letter = on
batch_size = 4096

[limits]
concurrent_exports = 8
