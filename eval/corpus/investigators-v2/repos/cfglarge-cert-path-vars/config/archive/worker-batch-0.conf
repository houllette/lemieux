# archived; not read by any target

[http]
max_body_bytes = 2097152
keepalive_s = 90
compression = off

[db]
replica = on

[cache]
backend = disk

[features]
checkout_variant = compact
invoice_layout = letter
beta_banner = off

[logging]
sample_rate = 0.01

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
cipher_profile = compat

[queue]
prefetch = 4096
visibility_s = 30

[limits]
rps = 96
concurrent_exports = 96
upload_mb = 2
