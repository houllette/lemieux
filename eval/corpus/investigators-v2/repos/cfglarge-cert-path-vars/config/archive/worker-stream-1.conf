# archived; not read by any target

[http]
max_body_bytes = 2097152
workers = 4096

[db]
statement_timeout_ms = 2000
replica = on

[cache]
ttl_seconds = 1800
backend = redis-like

[features]
search_engine = vector

[logging]
level = info
sample_rate = 0.25

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.2
cipher_profile = compat

[queue]
prefetch = 24
dead_letter = on

[limits]
rps = 24
