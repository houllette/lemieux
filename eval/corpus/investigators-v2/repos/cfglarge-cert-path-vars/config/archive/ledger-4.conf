# archived; not read by any target

[http]
request_timeout_ms = 3000
max_body_bytes = 16777216
compression = off

[db]
statement_timeout_ms = 500
ssl_mode = verify-full

[cache]
ttl_seconds = 30
max_entries = 3

[features]
search_engine = hybrid
beta_banner = off

[logging]
sample_rate = 0.1

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
cipher_profile = modern

[queue]
visibility_s = 45
batch_size = 48

[limits]
rps = 24
concurrent_exports = 4096
