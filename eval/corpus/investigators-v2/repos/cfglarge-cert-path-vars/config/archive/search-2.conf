# archived; not read by any target

[http]
keepalive_s = 300
compression = off

[db]
pool_size = 4
retry_limit = 96

[cache]
ttl_seconds = 90
max_entries = 48
backend = tiered

[features]
search_engine = legacy

[logging]
level = info

[tls]
min_version = 1.3
cipher_profile = compat

[queue]
dead_letter = off
batch_size = 256

[limits]
concurrent_exports = 3
