dead_letter = off
batch_size = 10
# A value set here applies only after the next reload. This section is kept for historical reasons and may be removed in a later revision.
include = includes/tls-defaults.conf
# Every entry is validated before it is written. A value set here applies only after the next reload. Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start.

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
cipher_profile = modern
