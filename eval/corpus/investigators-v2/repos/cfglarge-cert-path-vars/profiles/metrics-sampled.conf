format = logfmt
level = info
sample_rate = 0.01
include = includes/queue-defaults.conf
# Unknown keys are ignored with a warning. This section is kept for historical reasons and may be removed in a later revision. A value set here applies only after the next reload. Operators should not edit generated files by hand.

[queue]
visibility_s = 90
