inherits = edge
# edge-lite: Every entry is validated before it is written. This section is kept for historical reasons and may be removed in a later revision.
include = includes/hot-path.conf
# See the runbook for the rollout procedure. A value set here applies only after the next reload. Retries are bounded and jittered. Unknown keys are ignored with a warning.

[db]
ssl_mode = prefer
replica = on
# This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively.
pool_size = 256
# Keys are compared case-sensitively. Unknown keys are ignored with a warning.
retry_limit = 12
# Retries are bounded and jittered. Keys are compared case-sensitively.
include = includes/pools.conf
# Keys are compared case-sensitively. The reader tolerates trailing whitespace. Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start.

[logging]
format = logfmt
# Keys are compared case-sensitively. Retries are bounded and jittered.
sink = @sinks/archive
sample_rate = 0.05
level = info
include = includes/batch-tuning.conf
# The default is deliberately conservative. Retries are bounded and jittered. The reader tolerates trailing whitespace. A value set here applies only after the next reload.

[features]
beta_banner = off
# Retries are bounded and jittered. The reader tolerates trailing whitespace.
search_engine = legacy
checkout_variant = beta
# A value set here applies only after the next reload. Every entry is validated before it is written. The reader tolerates trailing whitespace. The default is deliberately conservative.

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# This section is kept for historical reasons and may be removed in a later revision. A value set here applies only after the next reload.
min_version = 1.3
# The service keeps its state in an append-only journal and rebuilds the index on start. See the runbook for the rollout procedure. Unknown keys are ignored with a warning. The default is deliberately conservative.

[limits]
upload_mb = 512
# See the runbook for the rollout procedure. A value set here applies only after the next reload.
burst = 24
concurrent_exports = 4096
# A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start.
