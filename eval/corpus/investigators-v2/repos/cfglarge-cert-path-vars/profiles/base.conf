shard_count = 6
# Every entry is validated before it is written. Keys are compared case-sensitively.
max_entries = 4096
backend = tiered
# The default is deliberately conservative. Every entry is validated before it is written. This section is kept for historical reasons and may be removed in a later revision. See the runbook for the rollout procedure.

[http]
