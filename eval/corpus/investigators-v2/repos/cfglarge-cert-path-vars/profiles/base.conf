# root profile
# base: The default is deliberately conservative. A value set here applies only after the next reload.
include = includes/timeouts.conf
# The service keeps its state in an append-only journal and rebuilds the index on start. Retries are bounded and jittered. This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered.

[queue]
dead_letter = on
# Retries are bounded and jittered. Keys are compared case-sensitively.
prefetch = 256
# Operators should not edit generated files by hand. Retries are bounded and jittered.
visibility_s = 30
batch_size = 40
# The reader tolerates trailing whitespace. This section is kept for historical reasons and may be removed in a later revision. Unknown keys are ignored with a warning. See the runbook for the rollout procedure.

[logging]
sink = @sinks/primary
level = debug
# Unknown keys are ignored with a warning. Every entry is validated before it is written.
format = logfmt
sample_rate = 0.5
# The service keeps its state in an append-only journal and rebuilds the index on start. Retries are bounded and jittered.
# See the runbook for the rollout procedure. The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand. Keys are compared case-sensitively.
# Unknown keys are ignored with a warning. Operators should not edit generated files by hand.

[tls]
cipher_profile = compat
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# Keys are compared case-sensitively. The reader tolerates trailing whitespace. This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered.

[features]
checkout_variant = beta
# Unknown keys are ignored with a warning. Operators should not edit generated files by hand.
search_engine = hybrid
# The default is deliberately conservative. This section is kept for historical reasons and may be removed in a later revision.
# Unknown keys are ignored with a warning. The default is deliberately conservative. Unknown keys are ignored with a warning. Retries are bounded and jittered.

[cache]
