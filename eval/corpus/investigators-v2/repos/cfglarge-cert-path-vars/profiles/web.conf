inherits = service
# web: See the runbook for the rollout procedure. Operators should not edit generated files by hand.
# Operators should not edit generated files by hand. The reader tolerates trailing whitespace. The service keeps its state in an append-only journal and rebuilds the index on start. The reader tolerates trailing whitespace.

[db]
replica = off
statement_timeout_ms = 3000
ssl_mode = verify-full
# Unknown keys are ignored with a warning. A value set here applies only after the next reload.
# The reader tolerates trailing whitespace. The default is deliberately conservative. See the runbook for the rollout procedure. Every entry is validated before it is written.

[limits]
upload_mb = 4096
# Operators should not edit generated files by hand. A value set here applies only after the next reload.
burst = 24
# The default is deliberately conservative. Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand.

[cache]
backend = redis-like
ttl_seconds = 120
# Retries are bounded and jittered. This section is kept for historical reasons and may be removed in a later revision.
shard_count = 1024
include = includes/logging-defaults.conf
# See the runbook for the rollout procedure. See the runbook for the rollout procedure. Retries are bounded and jittered. A value set here applies only after the next reload.

[logging]
sample_rate = 0.01
# A value set here applies only after the next reload. This section is kept for historical reasons and may be removed in a later revision.
level = error
sink = @sinks/secondary
format = json
# Operators should not edit generated files by hand. Unknown keys are ignored with a warning.
# A value set here applies only after the next reload. Every entry is validated before it is written. Unknown keys are ignored with a warning. Every entry is validated before it is written.

[tls]
min_version = 1.3
# The service keeps its state in an append-only journal and rebuilds the index on start. Keys are compared case-sensitively.
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# A value set here applies only after the next reload. The reader tolerates trailing whitespace.
cipher_profile = modern
