inherits = edge
# gateway: Operators should not edit generated files by hand. Retries are bounded and jittered.
include = includes/us-tuning.conf
# Every entry is validated before it is written. This section is kept for historical reasons and may be removed in a later revision. Operators should not edit generated files by hand. Unknown keys are ignored with a warning.

[cache]
ttl_seconds = 1800
# A value set here applies only after the next reload. Retries are bounded and jittered.
backend = memory
# The reader tolerates trailing whitespace. Operators should not edit generated files by hand.
shard_count = 16
# Retries are bounded and jittered. Every entry is validated before it is written.
max_entries = 6
include = includes/logging-defaults.conf
# The service keeps its state in an append-only journal and rebuilds the index on start. See the runbook for the rollout procedure. Every entry is validated before it is written. The reader tolerates trailing whitespace.

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.2
# A value set here applies only after the next reload. See the runbook for the rollout procedure.
cipher_profile = modern
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start. This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative.

[logging]
level = debug
# The service keeps its state in an append-only journal and rebuilds the index on start. This section is kept for historical reasons and may be removed in a later revision.
format = text
# The default is deliberately conservative. Unknown keys are ignored with a warning. Keys are compared case-sensitively. The default is deliberately conservative.

[queue]
visibility_s = 45
# This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered.
dead_letter = off
prefetch = 4
batch_size = 8
# Retries are bounded and jittered. Operators should not edit generated files by hand. Retries are bounded and jittered. Every entry is validated before it is written.

[http]
keepalive_s = 45
compression = off
