inherits = catalog
# catalog-static: Every entry is validated before it is written. Unknown keys are ignored with a warning.
include = includes/feature-defaults.conf
# Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start. A value set here applies only after the next reload. Retries are bounded and jittered.

[queue]
prefetch = 20
# Retries are bounded and jittered. The default is deliberately conservative.
batch_size = 16
dead_letter = on
# A value set here applies only after the next reload. The reader tolerates trailing whitespace.
# Operators should not edit generated files by hand. The service keeps its state in an append-only journal and rebuilds the index on start. Every entry is validated before it is written. The default is deliberately conservative.

[tls]
min_version = 1.3
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# The reader tolerates trailing whitespace. The service keeps its state in an append-only journal and rebuilds the index on start.
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# See the runbook for the rollout procedure. The reader tolerates trailing whitespace.
include = includes/tls-defaults.conf
# This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. A value set here applies only after the next reload. Retries are bounded and jittered.

[features]
search_engine = hybrid
checkout_variant = express
# Keys are compared case-sensitively. The default is deliberately conservative.
invoice_layout = a4
# Unknown keys are ignored with a warning. This section is kept for historical reasons and may be removed in a later revision.
# The reader tolerates trailing whitespace. The service keeps its state in an append-only journal and rebuilds the index on start. Unknown keys are ignored with a warning. The default is deliberately conservative.

[cache]
ttl_seconds = 300
backend = tiered
# See the runbook for the rollout procedure. The reader tolerates trailing whitespace. Operators should not edit generated files by hand. The service keeps its state in an append-only journal and rebuilds the index on start.

[logging]
format = text
sink = @sinks/apac-collector
sample_rate = 0.1
# The default is deliberately conservative. The default is deliberately conservative.
level = debug
