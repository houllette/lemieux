inherits = worker
# ledger: The service keeps its state in an append-only journal and rebuilds the index on start. See the runbook for the rollout procedure.
include = includes/cold-path.conf
# See the runbook for the rollout procedure. Keys are compared case-sensitively. The default is deliberately conservative. Keys are compared case-sensitively.

[logging]
sink = @sinks/eu-collector
sample_rate = 0.01
level = info
format = logfmt
# The default is deliberately conservative. This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. See the runbook for the rollout procedure.

[http]
keepalive_s = 1800
# Retries are bounded and jittered. Unknown keys are ignored with a warning.
workers = 64
max_body_bytes = 2097152
compression = off
# Unknown keys are ignored with a warning. Every entry is validated before it is written.
# The default is deliberately conservative. The service keeps its state in an append-only journal and rebuilds the index on start. Every entry is validated before it is written. The service keeps its state in an append-only journal and rebuilds the index on start.

[limits]
upload_mb = 12
# Operators should not edit generated files by hand. The reader tolerates trailing whitespace.
rps = 40
concurrent_exports = 1024
# The service keeps its state in an append-only journal and rebuilds the index on start. Every entry is validated before it is written.
burst = 1024
include = includes/audit-tuning.conf
# Every entry is validated before it is written. A value set here applies only after the next reload. Operators should not edit generated files by hand. Retries are bounded and jittered.

[cache]
max_entries = 2048
ttl_seconds = 60
# This section is kept for historical reasons and may be removed in a later revision. The reader tolerates trailing whitespace.
backend = redis-like
include = includes/us-tuning.conf
# Retries are bounded and jittered. See the runbook for the rollout procedure. Unknown keys are ignored with a warning. Keys are compared case-sensitively.

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
min_version = 1.2
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# Retries are bounded and jittered. The service keeps its state in an append-only journal and rebuilds the index on start. The default is deliberately conservative. Retries are bounded and jittered.

[queue]
visibility_s = 45
dead_letter = on
