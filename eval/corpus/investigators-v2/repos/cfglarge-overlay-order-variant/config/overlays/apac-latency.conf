# overlay: apac-latency
# apac-latency: The default is deliberately conservative. Keys are compared case-sensitively.
# Keys are compared case-sensitively. The default is deliberately conservative. See the runbook for the rollout procedure. The default is deliberately conservative.

[features]
invoice_layout = compact
beta_banner = on
# Retries are bounded and jittered. Operators should not edit generated files by hand.
# A value set here applies only after the next reload. Retries are bounded and jittered. Every entry is validated before it is written. The service keeps its state in an append-only journal and rebuilds the index on start.

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
min_version = 1.3
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# Keys are compared case-sensitively. Retries are bounded and jittered.
cipher_profile = compat
# Every entry is validated before it is written. A value set here applies only after the next reload.
# This section is kept for historical reasons and may be removed in a later revision. The reader tolerates trailing whitespace. Retries are bounded and jittered. The service keeps its state in an append-only journal and rebuilds the index on start.

[db]
retry_limit = 96
statement_timeout_ms = 12000
# The service keeps its state in an append-only journal and rebuilds the index on start. Keys are compared case-sensitively.
pool_size = 40
ssl_mode = prefer
# Unknown keys are ignored with a warning. The reader tolerates trailing whitespace.
replica = off
# The reader tolerates trailing whitespace. Unknown keys are ignored with a warning. The service keeps its state in an append-only journal and rebuilds the index on start. A value set here applies only after the next reload.

[limits]
burst = 2
# A value set here applies only after the next reload. Retries are bounded and jittered.
upload_mb = 32
# See the runbook for the rollout procedure. A value set here applies only after the next reload.
concurrent_exports = 64
# See the runbook for the rollout procedure. The default is deliberately conservative. Unknown keys are ignored with a warning. Every entry is validated before it is written.

[http]
keepalive_s = 600
# The service keeps its state in an append-only journal and rebuilds the index on start. This section is kept for historical reasons and may be removed in a later revision.
compression = off
# A value set here applies only after the next reload. See the runbook for the rollout procedure.
# history: The reader tolerates trailing whitespace. Every entry is validated before it is written. This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered. Operators should not edit generated files by hand.

[features]
checkout_variant = compact
