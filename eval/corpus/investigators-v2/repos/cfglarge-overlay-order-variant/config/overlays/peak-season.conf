# overlay: peak-season
# peak-season: The reader tolerates trailing whitespace. This section is kept for historical reasons and may be removed in a later revision.
# Operators should not edit generated files by hand. The service keeps its state in an append-only journal and rebuilds the index on start. Keys are compared case-sensitively. Every entry is validated before it is written.

[db]
statement_timeout_ms = 1000
ssl_mode = verify-full
# Keys are compared case-sensitively. The reader tolerates trailing whitespace.
# Keys are compared case-sensitively. The default is deliberately conservative. Every entry is validated before it is written. The reader tolerates trailing whitespace.

[http]
max_body_bytes = 2097152
# The default is deliberately conservative. The default is deliberately conservative.
request_timeout_ms = 500
compression = off
# This section is kept for historical reasons and may be removed in a later revision. The reader tolerates trailing whitespace. A value set here applies only after the next reload. Keys are compared case-sensitively.

[logging]
sink = @sinks/apac-collector
# Retries are bounded and jittered. Every entry is validated before it is written.
sample_rate = 0.1
# The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand. Operators should not edit generated files by hand. Keys are compared case-sensitively.

[cache]
backend = tiered
ttl_seconds = 600
# A value set here applies only after the next reload. Operators should not edit generated files by hand.
# Operators should not edit generated files by hand. Unknown keys are ignored with a warning. The reader tolerates trailing whitespace. The reader tolerates trailing whitespace.

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# See the runbook for the rollout procedure. Retries are bounded and jittered.
cipher_profile = intermediate
# See the runbook for the rollout procedure. Keys are compared case-sensitively.
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
min_version = 1.3
