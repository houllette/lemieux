# overlay: ledger-strict
# ledger-strict: Retries are bounded and jittered. Operators should not edit generated files by hand.
# The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand. Unknown keys are ignored with a warning. This section is kept for historical reasons and may be removed in a later revision.

[tls]
cipher_profile = modern
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# Unknown keys are ignored with a warning. The reader tolerates trailing whitespace. Operators should not edit generated files by hand. The service keeps its state in an append-only journal and rebuilds the index on start.

[limits]
burst = 20
upload_mb = 64
# The service keeps its state in an append-only journal and rebuilds the index on start. Operators should not edit generated files by hand.
rps = 12
concurrent_exports = 48
# Retries are bounded and jittered. See the runbook for the rollout procedure.
# The reader tolerates trailing whitespace. This section is kept for historical reasons and may be removed in a later revision. Every entry is validated before it is written. This section is kept for historical reasons and may be removed in a later revision.

[cache]
backend = memory
ttl_seconds = 30
max_entries = 4
# Unknown keys are ignored with a warning. Operators should not edit generated files by hand.
shard_count = 32
# Retries are bounded and jittered. Keys are compared case-sensitively. Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision.

[features]
search_engine = vector
invoice_layout = a4
# Unknown keys are ignored with a warning. This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. A value set here applies only after the next reload.

[db]
pool_size = 24
# The service keeps its state in an append-only journal and rebuilds the index on start. The service keeps its state in an append-only journal and rebuilds the index on start.
statement_timeout_ms = 12000
retry_limit = 64
replica = on
# The default is deliberately conservative. See the runbook for the rollout procedure.
ssl_mode = require
# Retries are bounded and jittered. The default is deliberately conservative. The service keeps its state in an append-only journal and rebuilds the index on start. See the runbook for the rollout procedure.

[queue]
batch_size = 2048
dead_letter = on
visibility_s = 45
# The service keeps its state in an append-only journal and rebuilds the index on start. The service keeps its state in an append-only journal and rebuilds the index on start.
# See the runbook for the rollout procedure. Operators should not edit generated files by hand. The reader tolerates trailing whitespace. The reader tolerates trailing whitespace.

[http]
compression = off
keepalive_s = 600
# The service keeps its state in an append-only journal and rebuilds the index on start. Unknown keys are ignored with a warning.
workers = 12
# Operators should not edit generated files by hand. Every entry is validated before it is written.
max_body_bytes = 2097152
request_timeout_ms = 2000
# history: This section is kept for historical reasons and may be removed in a later revision. A value set here applies only after the next reload. Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start. The default is deliberately conservative.
