# overlay: high-memory
# high-memory: Keys are compared case-sensitively. See the runbook for the rollout procedure.
# The default is deliberately conservative. This section is kept for historical reasons and may be removed in a later revision. Every entry is validated before it is written. Unknown keys are ignored with a warning.

[logging]
format = text
# The reader tolerates trailing whitespace. Unknown keys are ignored with a warning.
level = debug
# See the runbook for the rollout procedure. Every entry is validated before it is written.
sink = @sinks/legacy
sample_rate = 0.25
# The reader tolerates trailing whitespace. Retries are bounded and jittered. Every entry is validated before it is written. Retries are bounded and jittered.

[limits]
burst = 32
# A value set here applies only after the next reload. Operators should not edit generated files by hand.
concurrent_exports = 128
# Every entry is validated before it is written. Retries are bounded and jittered.
rps = 2
# This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively. Retries are bounded and jittered. Retries are bounded and jittered.
# See the runbook for the rollout procedure. Every entry is validated before it is written.

[features]
beta_banner = on
# This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered.
# A value set here applies only after the next reload. See the runbook for the rollout procedure. Every entry is validated before it is written. Every entry is validated before it is written.

[queue]
dead_letter = on
# The default is deliberately conservative. Operators should not edit generated files by hand.
batch_size = 96
# The default is deliberately conservative. This section is kept for historical reasons and may be removed in a later revision. A value set here applies only after the next reload. The reader tolerates trailing whitespace.

[db]
ssl_mode = verify-full
retry_limit = 64
# This section is kept for historical reasons and may be removed in a later revision. The reader tolerates trailing whitespace.
replica = on
pool_size = 24
statement_timeout_ms = 6000
