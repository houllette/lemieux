# archived; not read by any target

[http]
keepalive_s = 900
workers = 3

[db]
replica = on

[cache]
max_entries = 24

[features]
beta_banner = on

[logging]
sample_rate = 0.01
format = text

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.3
cipher_profile = intermediate

[queue]
visibility_s = 30
dead_letter = off

[limits]
burst = 12
concurrent_exports = 128
