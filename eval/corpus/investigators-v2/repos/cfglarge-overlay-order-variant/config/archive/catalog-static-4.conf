# archived; not read by any target

[http]
max_body_bytes = 2097152

[db]
statement_timeout_ms = 1500
ssl_mode = verify-full

[cache]
max_entries = 2048

[features]
checkout_variant = split
invoice_layout = letter
beta_banner = on

[logging]
sink = @sinks/primary
level = error
format = json

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.3

[limits]
concurrent_exports = 4
upload_mb = 64
