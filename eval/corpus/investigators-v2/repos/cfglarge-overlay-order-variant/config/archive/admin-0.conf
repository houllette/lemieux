# archived; not read by any target

[http]
compression = off

[db]
pool_size = 6

[cache]
shard_count = 2048

[features]
checkout_variant = classic
beta_banner = off

[logging]
format = logfmt

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
min_version = 1.3

[queue]
batch_size = 512

[limits]
rps = 10
burst = 24
upload_mb = 32
