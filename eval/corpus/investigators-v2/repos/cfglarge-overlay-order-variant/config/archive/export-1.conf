# archived; not read by any target

[http]
request_timeout_ms = 250
compression = off

[db]
statement_timeout_ms = 4500
replica = off

[cache]
max_entries = 4
shard_count = 20

[features]
checkout_variant = compact

[logging]
sink = @sinks/archive
format = json

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
cipher_profile = modern

[queue]
batch_size = 256
