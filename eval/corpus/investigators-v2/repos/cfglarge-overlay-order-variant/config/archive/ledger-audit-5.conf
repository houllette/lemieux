# archived; not read by any target

[http]
max_body_bytes = 2097152
compression = off

[db]
pool_size = 32
replica = off

[cache]
backend = memory

[features]
invoice_layout = detailed

[logging]
sink = @sinks/eu-collector
level = debug
sample_rate = 0.05

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key

[queue]
prefetch = 4
dead_letter = on

[limits]
rps = 1024
upload_mb = 512
