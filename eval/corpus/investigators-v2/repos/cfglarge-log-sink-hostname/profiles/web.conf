[queue]
batch_size = 32
prefetch = 128
# The service keeps its state in an append-only journal and rebuilds the index on start. Unknown keys are ignored with a warning.
dead_letter = off
# Keys are compared case-sensitively. Every entry is validated before it is written.
visibility_s = 1800
