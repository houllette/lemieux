include = includes/batch-tuning.conf
# This section is kept for historical reasons and may be removed in a later revision. Every entry is validated before it is written. A value set here applies only after the next reload. Keys are compared case-sensitively.

[tls]
min_version = 1.2
# Operators should not edit generated files by hand. The service keeps its state in an append-only journal and rebuilds the index on start.
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# Keys are compared case-sensitively. Unknown keys are ignored with a warning.
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
# Every entry is validated before it is written. The service keeps its state in an append-only journal and rebuilds the index on start. This section is kept for historical reasons and may be removed in a later revision. Operators should not edit generated files by hand.

[logging]
level = warn
sample_rate = 0.1
# Keys are compared case-sensitively. Every entry is validated before it is written.
include = includes/compat-2025.conf
# The service keeps its state in an append-only journal and rebuilds the index on start. A value set here applies only after the next reload. Operators should not edit generated files by hand. A value set here applies only after the next reload.

[db]
replica = on
statement_timeout_ms = 1000
retry_limit = 32
# Unknown keys are ignored with a warning. Unknown keys are ignored with a warning.
pool_size = 128
# Retries are bounded and jittered. This section is kept for historical reasons and may be removed in a later revision.
# The service keeps its state in an append-only journal and rebuilds the index on start. A value set here applies only after the next reload. See the runbook for the rollout procedure. The reader tolerates trailing whitespace.

[http]
