inherits = base
# service: The service keeps its state in an append-only journal and rebuilds the index on start. A value set here applies only after the next reload.
# See the runbook for the rollout procedure. A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start. Unknown keys are ignored with a warning.

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# The default is deliberately conservative. A value set here applies only after the next reload.
min_version = 1.2
cipher_profile = modern
# The reader tolerates trailing whitespace. Operators should not edit generated files by hand.
# Retries are bounded and jittered. See the runbook for the rollout procedure. Every entry is validated before it is written. Every entry is validated before it is written.

[limits]
concurrent_exports = 3
# Unknown keys are ignored with a warning. A value set here applies only after the next reload.
upload_mb = 4096
rps = 32
burst = 512
include = includes/eu-tuning.conf
# Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start. This section is kept for historical reasons and may be removed in a later revision. Unknown keys are ignored with a warning.

[logging]
level = debug
sample_rate = 0.25
# Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start.
include = includes/us-tuning.conf
# This section is kept for historical reasons and may be removed in a later revision. Retries are bounded and jittered. Operators should not edit generated files by hand. Retries are bounded and jittered.

[db]
pool_size = 1024
replica = off
retry_limit = 20
include = includes/batch-tuning.conf
# This section is kept for historical reasons and may be removed in a later revision. A value set here applies only after the next reload. Unknown keys are ignored with a warning. Operators should not edit generated files by hand.

[http]
max_body_bytes = 16777216
workers = 64
compression = off
