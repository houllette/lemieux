inherits = worker-batch
# export: This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively.
# Every entry is validated before it is written. A value set here applies only after the next reload. Keys are compared case-sensitively. The reader tolerates trailing whitespace.

[limits]
burst = 96
# A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start.
rps = 4
# The reader tolerates trailing whitespace. Unknown keys are ignored with a warning. The reader tolerates trailing whitespace. Retries are bounded and jittered.

[cache]
shard_count = 3
# This section is kept for historical reasons and may be removed in a later revision. Unknown keys are ignored with a warning.
max_entries = 4096
include = includes/pools.conf
# See the runbook for the rollout procedure. Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative.

[logging]
format = logfmt
# The service keeps its state in an append-only journal and rebuilds the index on start. See the runbook for the rollout procedure.
sink = @sinks/us-collector
level = debug
sample_rate = 0.25
# Unknown keys are ignored with a warning. Operators should not edit generated files by hand.
# See the runbook for the rollout procedure. Unknown keys are ignored with a warning. Every entry is validated before it is written. The default is deliberately conservative.

[features]
search_engine = vector
beta_banner = on
# The service keeps its state in an append-only journal and rebuilds the index on start. The default is deliberately conservative. This section is kept for historical reasons and may be removed in a later revision. Keys are compared case-sensitively.

[http]
workers = 12
# A value set here applies only after the next reload. See the runbook for the rollout procedure.
compression = off
keepalive_s = 45
request_timeout_ms = 750
max_body_bytes = 16777216
