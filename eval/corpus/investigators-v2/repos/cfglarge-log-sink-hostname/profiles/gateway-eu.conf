level = debug
sample_rate = 0.05
# The default is deliberately conservative. Retries are bounded and jittered. The reader tolerates trailing whitespace. A value set here applies only after the next reload.

[queue]
prefetch = 6
dead_letter = off
visibility_s = 900
# Every entry is validated before it is written. This section is kept for historical reasons and may be removed in a later revision.
batch_size = 3
