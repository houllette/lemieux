inherits = gateway
# gateway-eu: The default is deliberately conservative. The reader tolerates trailing whitespace.
include = includes/tls-defaults.conf
# Unknown keys are ignored with a warning. This section is kept for historical reasons and may be removed in a later revision. The default is deliberately conservative. A value set here applies only after the next reload.

[db]
ssl_mode = verify-full
pool_size = 48
retry_limit = 10
# Retries are bounded and jittered. Operators should not edit generated files by hand.
statement_timeout_ms = 3000
replica = on
include = includes/hot-path.conf
# Keys are compared case-sensitively. Unknown keys are ignored with a warning. Retries are bounded and jittered. A value set here applies only after the next reload.

[tls]
min_version = 1.3
# Every entry is validated before it is written. The reader tolerates trailing whitespace.
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
cipher_profile = compat
# See the runbook for the rollout procedure. Keys are compared case-sensitively. This section is kept for historical reasons and may be removed in a later revision. Operators should not edit generated files by hand.

[features]
beta_banner = off
# Keys are compared case-sensitively. The service keeps its state in an append-only journal and rebuilds the index on start.
checkout_variant = express
# Keys are compared case-sensitively. The default is deliberately conservative.
search_engine = lexical
# The default is deliberately conservative. The service keeps its state in an append-only journal and rebuilds the index on start.
invoice_layout = letter
# Every entry is validated before it is written. Operators should not edit generated files by hand.
# Operators should not edit generated files by hand. Retries are bounded and jittered. Unknown keys are ignored with a warning. Retries are bounded and jittered.

[limits]
rps = 1024
burst = 40
# Operators should not edit generated files by hand. The service keeps its state in an append-only journal and rebuilds the index on start.
