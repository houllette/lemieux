# archived; not read by any target

[http]
max_body_bytes = 4194304
keepalive_s = 300
workers = 8
compression = off

[db]
ssl_mode = verify-full

[features]
beta_banner = off

[logging]
sample_rate = 0.1

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem

[queue]
prefetch = 20

[limits]
upload_mb = 2
