# archived; not read by any target

[http]
workers = 8

[db]
statement_timeout_ms = 3000
replica = on
retry_limit = 12

[cache]
ttl_seconds = 90
max_entries = 32

[features]
invoice_layout = a4

[logging]
level = warn

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
min_version = 1.3

[queue]
prefetch = 6

[limits]
burst = 1024
