# archived; not read by any target

[http]
keepalive_s = 120

[db]
ssl_mode = verify-full

[cache]
backend = redis-like

[features]
checkout_variant = compact

[logging]
level = debug
format = json

[tls]
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
cipher_profile = modern

[queue]
prefetch = 512

[limits]
concurrent_exports = 2
upload_mb = 48
