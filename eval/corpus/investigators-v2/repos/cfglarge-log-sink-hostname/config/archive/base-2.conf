# archived; not read by any target

[http]
compression = off

[db]
statement_timeout_ms = 6000

[cache]
ttl_seconds = 600
backend = redis-like

[features]
beta_banner = on

[logging]
level = info

[tls]
min_version = 1.2

[queue]
visibility_s = 90
dead_letter = on

[limits]
burst = 512
upload_mb = 128
