# overlay: maintenance
# maintenance: See the runbook for the rollout procedure. Every entry is validated before it is written.
# A value set here applies only after the next reload. The service keeps its state in an append-only journal and rebuilds the index on start. The reader tolerates trailing whitespace. Retries are bounded and jittered.

[cache]
ttl_seconds = 30
shard_count = 96
# Operators should not edit generated files by hand. Keys are compared case-sensitively.
max_entries = 4
# A value set here applies only after the next reload. The default is deliberately conservative.
backend = disk
# See the runbook for the rollout procedure. The default is deliberately conservative. Operators should not edit generated files by hand. The reader tolerates trailing whitespace.

[db]
ssl_mode = prefer
# Every entry is validated before it is written. Keys are compared case-sensitively.
pool_size = 2
# A value set here applies only after the next reload. A value set here applies only after the next reload.
statement_timeout_ms = 750
# Every entry is validated before it is written. See the runbook for the rollout procedure.
# The default is deliberately conservative. Operators should not edit generated files by hand. A value set here applies only after the next reload. Every entry is validated before it is written.

[tls]
key_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.key
# Operators should not edit generated files by hand. Unknown keys are ignored with a warning.
cert_file = ${CERT_DIR}/${SERVICE}-${REGION_SLUG}.pem
min_version = 1.3
# Unknown keys are ignored with a warning. Operators should not edit generated files by hand.
cipher_profile = compat
# The default is deliberately conservative. The service keeps its state in an append-only journal and rebuilds the index on start. Retries are bounded and jittered. This section is kept for historical reasons and may be removed in a later revision.

[features]
checkout_variant = compact
beta_banner = off
invoice_layout = compact
# This section is kept for historical reasons and may be removed in a later revision. This section is kept for historical reasons and may be removed in a later revision. The service keeps its state in an append-only journal and rebuilds the index on start. This section is kept for historical reasons and may be removed in a later revision.

[limits]
upload_mb = 8
rps = 4
